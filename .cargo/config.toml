[build]
target = "x86_64-unknown-none"
# Отчёт об отказе ядра (src/diag/panic.rs) раскручивает стек по цепочке
# RBP; без обязательных frame pointers цепочка обрывается на первом же
# кадре, который компилятор оптимизировал.
rustflags = ["-C", "force-frame-pointers=yes"]

# ВНИМАНИЕ: профиль release задаётся ТОЛЬКО в Cargo.toml. Профиль в
# config.toml перекрывает манифест молча: из-за дубля здесь ядро
# собиралось с opt-level=2, а правки opt-level в Cargo.toml не имели
# эффекта, и kernel.bin не влезал в 2048 секторов.
