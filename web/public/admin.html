<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Панель Owner — DeiX OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">DeiX OS</a>
      <nav class="links">
        <a href="/">Сайт</a>
        <span id="nav-auth" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="denied-view" hidden>
      <div class="panel login-card">
        <h2 id="denied-title">Нужен вход</h2>
        <p class="hint" id="denied-text"></p>
        <div class="row-gap"><a class="btn primary" id="denied-login" href="/login?next=/admin">Войти</a></div>
      </div>
    </section>

    <section id="panel-view" hidden>
      <div class="toolbar">
        <h1 class="title">Заявки на dev-токен</h1>
        <div class="right">
          <label class="switch"><input type="checkbox" id="open-switch"><span id="open-label">Приём заявок</span></label>
          <button class="btn small" id="refresh-btn" type="button">Обновить</button>
          <a class="btn small" href="/account">Аккаунт</a>
        </div>
      </div>

      <div class="counters" id="counters"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <span class="hint" id="updated"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Устройство</th><th>Заявитель</th><th>Статус</th><th>Источник</th><th>Комментарий</th><th>Подана</th><th>Действия</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Заявок нет.</div>
      </div>
      <p class="hint">Токен генерирует база при одобрении и не показывается на сайте: устройство получает его само при следующей проверке статуса и только один раз.</p>
    </section>
  </main>

  <script src="/site.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
