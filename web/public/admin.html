<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Панель Owner — DeiX OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">DeiX OS</a>
      <nav class="links">
        <a href="/">Сайт</a>
        <span id="who" class="chip" hidden></span>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="login-view" hidden>
      <div class="panel login-card">
        <h2>Вход для Owner</h2>
        <form id="login-form" class="stack">
          <label>Логин <input id="login-user" autocomplete="username" required></label>
          <label>Пароль <input id="login-pass" type="password" autocomplete="current-password" required></label>
          <button class="btn primary" id="login-btn" type="submit">Войти</button>
        </form>
        <div class="result" id="login-result" hidden></div>
      </div>
    </section>

    <section id="panel-view" hidden>
      <div class="toolbar">
        <h1 class="title">Заявки на dev-токен</h1>
        <div class="right">
          <label class="switch"><input type="checkbox" id="open-switch"><span id="open-label">Приём заявок</span></label>
          <button class="btn small" id="refresh-btn" type="button">Обновить</button>
          <button class="btn small" id="password-btn" type="button">Сменить пароль</button>
          <button class="btn small" id="logout-btn" type="button">Выйти</button>
        </div>
      </div>

      <div class="counters" id="counters"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <span class="hint" id="updated"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Устройство</th><th>Статус</th><th>Источник</th><th>Комментарий</th><th>Подана</th><th>Действия</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>Заявок нет.</div>
      </div>
      <p class="hint">Токен генерирует база при одобрении и не показывается на сайте: устройство получает его само при следующей проверке статуса и только один раз.</p>
    </section>
  </main>

  <dialog id="password-dialog">
    <h3>Смена пароля</h3>
    <form id="password-form" class="stack">
      <label>Текущий пароль <input id="pw-current" type="password" autocomplete="current-password" required></label>
      <label>Новый пароль (от 10 символов) <input id="pw-next" type="password" autocomplete="new-password" minlength="10" required></label>
      <div class="result err" id="pw-result" hidden></div>
      <div class="row">
        <button class="btn" type="button" id="pw-cancel">Отмена</button>
        <button class="btn primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="/site.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
