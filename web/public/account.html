<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Аккаунт — DeiX OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">DeiX OS</a>
      <nav class="links">
        <a href="/">О проекте</a>
        <a href="/request">Запросить токен</a>
        <span id="nav-auth" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="page wrap">
    <h1>Аккаунт</h1>
    <div class="two" id="account-view" hidden>
      <div class="panel">
        <h3>Профиль</h3>
        <p><span class="hint">Имя пользователя</span><br><b id="acc-name"></b> <span class="badge src" id="acc-role"></span></p>
        <p><span class="hint">Почта</span><br><span id="acc-email"></span></p>
        <div class="row-gap">
          <a class="btn primary" href="/request">Заявки на токен</a>
          <a class="btn" id="admin-link" href="/admin" hidden>Панель Owner</a>
          <button class="btn" id="logout-btn" type="button">Выйти</button>
        </div>
      </div>
      <div class="panel wide">
        <h3>Мои устройства</h3>
        <p class="hint">В DeiX выполните <code>dev link</code>: система покажет код вида XXXX-XXXX, действует 10 минут. Заявку на токен можно подать только для привязанного устройства.</p>
        <form id="link-form" class="row-gap" autocomplete="off">
          <input id="link-code" name="code" required maxlength="9" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Код привязки">
          <button class="btn primary" type="submit">Привязать</button>
        </form>
        <div class="result" id="link-result" hidden></div>
        <div id="devices"></div>
      </div>
      <div class="panel">
        <h3>Смена пароля</h3>
        <form id="password-form" class="stack">
          <label>Текущий пароль <input id="pw-current" type="password" autocomplete="current-password" required></label>
          <label>Новый пароль (от 8 символов) <input id="pw-next" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
          <label>Повторите новый пароль <input id="pw-next2" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
          <button class="btn primary" type="submit">Сменить пароль</button>
        </form>
        <div class="result" id="pw-result" hidden></div>
      </div>
    </div>
  </main>
  <script src="/site.js"></script>
  <script src="/account.js"></script>
</body>
</html>
