<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — DeiX OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">DeiX OS</a>
      <nav class="links">
        <a href="/">О проекте</a>
        <a href="/request">Запросить токен</a>
        <span id="nav-auth" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="panel login-card">
      <h2>Регистрация</h2>
      <form id="register-form" class="stack" autocomplete="off">
        <label>Имя пользователя
          <input id="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username">
          <span class="hint">3–24 символа: латинские буквы, цифры и _</span>
        </label>
        <label>Почта <input id="email" type="email" required autocomplete="email"></label>
        <label>Пароль <input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
        <label>Повторите пароль <input id="password2" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
        <div class="hp" aria-hidden="true"><label>Сайт <input id="website" tabindex="-1" autocomplete="off"></label></div>
        <div id="captcha"></div>
        <button class="btn primary" id="register-btn" type="submit">Создать аккаунт</button>
      </form>
      <div class="result" id="register-result" hidden></div>
      <p class="hint">Уже есть аккаунт? <a id="to-login" href="/login">Войти</a></p>
    </div>
  </main>
  <script src="/site.js"></script>
  <script src="/register.js"></script>
</body>
</html>
