<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — DeiX OS</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/favicon.svg" alt="">DeiX OS</a>
      <nav class="links">
        <a href="/">О проекте</a>
        <a href="/request">Запросить токен</a>
        <span id="nav-auth" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="panel login-card">
      <h2>Вход</h2>
      <form id="login-form" class="stack">
        <label>Имя пользователя или почта <input id="identifier" autocomplete="username" required></label>
        <label>Пароль <input id="password" type="password" autocomplete="current-password" required></label>
        <div id="captcha"></div>
        <button class="btn primary" id="login-btn" type="submit">Войти</button>
      </form>
      <div class="result" id="login-result" hidden></div>
      <p class="hint">Нет аккаунта? <a id="to-register" href="/register">Зарегистрироваться</a></p>
    </div>
  </main>
  <script src="/site.js"></script>
  <script src="/login.js"></script>
</body>
</html>
