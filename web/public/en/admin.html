<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Owner panel — DeiX OS</title>
  <meta name="theme-color" content="#06060c">
  <link rel="alternate" hreflang="ru" href="/admin">
  <link rel="alternate" hreflang="en" href="/en/admin">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="admin">
  <main class="page wrap">
    <section id="denied-view" hidden>
      <div class="panel auth-card state" id="denied-card">
        <div class="big"><svg class="icon"><use href="/icons.svg#lock"/></svg></div>
        <h1 id="denied-title">Sign-in required</h1>
        <p id="denied-text"></p>
        <div class="row-gap" id="denied-actions"></div>
      </div>
    </section>

    <section id="panel-view" hidden>
      <div class="toolbar">
        <h1 class="title">Requests for a <span class="grad">dev token</span></h1>
        <div class="right">
          <label class="switch"><input type="checkbox" id="open-switch"><span id="open-label">Accepting requests</span></label>
          <button class="btn small" id="refresh-btn" type="button">Refresh</button>
          <a class="btn small" href="/en/account">Account</a>
        </div>
      </div>

      <div class="counters" id="counters"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs"></div>
        <span class="hint" id="updated"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Device</th><th>Requester</th><th>Status</th><th>Source</th><th>Comment</th><th>Filed</th><th>Actions</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden>No requests.</div>
      </div>
      <p class="hint">The token is generated by the database on approval and is not shown on the site: the device receives it on its next status check, once.</p>
    </section>
  </main>
  <script src="/i18n.js"></script>
  <script src="/site.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
