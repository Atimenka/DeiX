name: Build DeiX

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'arena/**'   # рабочие ветки релизной подготовки
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build + verify DeiX (BIOS disk image)
    runs-on: ubuntu-latest
    # Чтобы при падении QEMU-smoke-теста можно было получить лог загрузки:
    # шаг создаёт Issue с полным содержимым qemu_disk.log.
    permissions:
      issues: write
      contents: read

    steps:
      # ---------- 0. Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 1. Системные зависимости ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            binutils \
            gcc \
            g++ \
            make \
            python3 \
            qemu-system-x86 \
            xorriso \
            erofs-utils \
            file \
            xxd

      # ---------- 2. Статические проверки инструментов ----------
      - name: Python tools compile check
        run: python3 -m py_compile tools/*.py

      - name: Partition map cross-check
        run: python3 tools/check_partition_map.py

      # ---------- 3. Rust nightly ----------
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      # ---------- 4. Сборка ----------
      - name: Run build.sh
        run: bash ./build.sh 2>&1 | tee /tmp/build_log.txt
        env:
          RUST_BACKTRACE: "1"
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build_log.txt
          if-no-files-found: ignore
          retention-days: 1

      # ---------- 5. Проверка артефактов ----------
      - name: Verify artifacts
        run: |
          echo "== build/ contents =="
          ls -lh build/
          echo "== checking files =="
          for f in deix_disk.img kernel.bin boot_sector.bin stage2.bin ramboot.bin SHA256SUMS; do
            if [ -f "build/$f" ]; then
              echo "OK: build/$f"
            else
              echo "MISSING: build/$f"
            fi
          done
          echo "== checking release img =="
          ls build/deix-*-x86_64.img 2>&1 || true
          echo "== SHA256SUMS content =="
          cat build/SHA256SUMS 2>&1 || true
          echo "== verifying =="
          for f in deix_disk.img kernel.bin boot_sector.bin stage2.bin ramboot.bin SHA256SUMS; do
            test -f "build/$f" || echo "WARN: Нет build/$f"
          done
          ls build/deix-*-x86_64.img >/dev/null 2>&1 || echo "WARN: Нет релизного образа deix-*-x86_64.img"
          (cd build && sha256sum -c SHA256SUMS) 2>&1 || echo "WARN: sha256sum check failed"

      # ---------- 6. Smoke-тест: загрузка до маркера ядра ----------
      - name: QEMU boot smoke test
        timeout-minutes: 5
        run: |
          # Ядро не завершает работу само, поэтому QEMU останавливается
          # по timeout; успех определяется маркерами загрузки в serial-логе.
          timeout 120 qemu-system-x86_64 \
            -drive format=raw,file=build/deix_disk.img,if=ide \
            -m 256M \
            -display none \
            -no-reboot \
            -serial stdio \
            -monitor none \
            > qemu_disk.log 2>&1 || [ $? -eq 124 ]
          echo "== QEMU disk log (tail) =="
          tail -n 80 qemu_disk.log
          {
            echo "## QEMU Disk Log (tail 80)"
            echo '```'
            tail -n 80 qemu_disk.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '=== DeiX boot: serial debug active ===' qemu_disk.log; then
            echo "FAIL: нет маркера старта ядра"
            echo "--- LOG START ---"
            cat qemu_disk.log
            echo "--- LOG END ---"
            exit 1
          fi
          if ! grep -q 'mini kernel booted successfully!' qemu_disk.log; then
            echo "FAIL: ядро не дошло до конца инициализации"
            echo "--- LOG START ---"
            cat qemu_disk.log
            echo "--- LOG END ---"
            exit 1
          fi
          if grep -q 'KERNEL PANIC' qemu_disk.log; then
            echo "FAIL: паника ядра во время загрузки"; exit 1
          fi

      # ---------- 6b. При падении smoke-теста — выгружаем диагностику в Issue ----------
      - name: Dump QEMU diagnostics to issue on failure
        if: failure()
        run: |
          {
            echo "=== QEMU Boot Diagnostics ==="
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Log size: $(wc -c < qemu_disk.log 2>/dev/null || echo 0) bytes"
            echo "Marker serial debug: $(grep -c 'serial debug active' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker booted: $(grep -c 'mini kernel booted' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker R: $(grep -c '^R' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker K: $(grep -c '^K' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker 1: $(grep -c '^1' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker 2: $(grep -c '^2' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker 3: $(grep -c '^3' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker 4: $(grep -c '^4' qemu_disk.log 2>/dev/null || echo 0)"
            echo "Marker kernel_main: $(grep -c 'kernel_main entered' qemu_disk.log 2>/dev/null || echo 0)"
            echo "PANIC: $(grep -c 'KERNEL PANIC' qemu_disk.log 2>/dev/null || echo 0)"
            echo ""
            head -30 qemu_disk.log 2>/dev/null || echo "(no log)"
            echo "..."
            tail -30 qemu_disk.log 2>/dev/null || echo ""
          } > /tmp/body.md
          python3 -c "import json,os; json.dump({'title':'CI: QEMU boot failed (run '+os.environ.get('GITHUB_RUN_ID','')+')', 'body':open('/tmp/body.md').read()}, open('/tmp/payload.json','w'))"
          curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" --data-binary @/tmp/payload.json "https://api.github.com/repos/$GITHUB_REPOSITORY/issues"

      # ---------- 7. Регрессия: первый и повторные запуски (персистентность) ----------
      - name: QEMU scenario - first boot, account, two reboots
        timeout-minutes: 15
        run: python3 tools/qemu_scenario_reboot.py

      - name: Upload scenario log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-scenario-log
          path: /tmp/qemu_scenario.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 8. Регрессия: установка на второй диск ----------
      - name: QEMU install test - install to slave disk and boot from it
        timeout-minutes: 15
        run: python3 tools/qemu_install_test.py

      # ---------- 9. Тулчейн MEX ----------
      - name: Subsystems and MEX toolchain test
        run: python3 tools/test_all_subsystems.py

      # ---------- 10. Артефакты ----------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deix-release
          path: |
            build/deix_disk.img
            build/deix-*-x86_64.img
            build/kernel.bin
            build/boot_sector.bin
            build/stage2.bin
            build/ramboot.bin
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload ISO (if built)
        if: hashFiles('build/deix.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deix-iso
          path: build/deix.iso
          if-no-files-found: warn
          retention-days: 30

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: qemu_disk.log
          if-no-files-found: ignore
          retention-days: 7
