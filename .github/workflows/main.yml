name: Build DeiX

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'arena/**'   # рабочие ветки релизной подготовки
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build + verify DeiX (BIOS disk image)
    runs-on: ubuntu-latest

    steps:
      # ---------- 0. Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- 1. Системные зависимости ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            binutils \
            gcc \
            g++ \
            make \
            python3 \
            qemu-system-x86 \
            xorriso \
            erofs-utils \
            file \
            xxd

      # ---------- 2. Статические проверки инструментов ----------
      - name: Python tools compile check
        run: python3 -m py_compile tools/*.py

      - name: Partition map cross-check
        run: python3 tools/check_partition_map.py

      # ---------- 3. Rust nightly ----------
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: USB HID boot mouse report parser tests
        run: |
          rustc --edition=2021 --test src/usb_hid_mouse.rs -o /tmp/deix-usb-hid-test
          /tmp/deix-usb-hid-test

      - name: USB 2.0 descriptor and EHCI layout tests
        run: |
          rustc --edition=2021 --test tools/usb2_layout_tests.rs -o /tmp/deix-usb2-tests
          /tmp/deix-usb2-tests

      - name: PS/2 raw scan-set 2 tests
        run: |
          rustc --edition=2021 --test src/ps2_set2.rs -o /tmp/deix-ps2-set2-tests
          /tmp/deix-ps2-set2-tests

      - name: NVIDIA PCI resource decoding tests
        run: |
          rustc --edition=2021 --test src/nvidia_probe.rs -o /tmp/deix-nvidia-probe-tests
          /tmp/deix-nvidia-probe-tests

      - name: Service dependency and manifest tests
        run: |
          rustc --edition=2021 --test tools/nanocore_policy_tests.rs -o /tmp/deix-nanocore-policy-tests
          /tmp/deix-nanocore-policy-tests

      - name: Dinit service lifecycle policy tests
        run: |
          rustc --edition=2021 --test tools/dinit_service_tests.rs -o /tmp/deix-dinit-tests
          /tmp/deix-dinit-tests

      - name: Nano-Core IPC safety tests
        run: |
          rustc --edition=2021 --test tools/ipc_tests.rs -o /tmp/deix-ipc-tests
          /tmp/deix-ipc-tests

      - name: USB boot keyboard tests
        run: |
          rustc --edition=2021 --test tools/usb_keyboard_tests.rs -o /tmp/deix-usb-keyboard-tests
          /tmp/deix-usb-keyboard-tests

      - name: Mouse button source and hotplug tests
        run: |
          rustc --edition=2021 --test src/mouse_buttons.rs -o /tmp/deix-mouse-buttons-tests
          /tmp/deix-mouse-buttons-tests

      - name: Relative mouse speed tests
        run: |
          rustc --edition=2021 --test src/mouse_speed.rs -o /tmp/deix-mouse-speed-tests
          /tmp/deix-mouse-speed-tests

      - name: Renderer window clipping tests
        run: |
          rustc --edition=2021 --test tools/renderer_clip_tests.rs -o /tmp/deix-renderer-clip-tests
          /tmp/deix-renderer-clip-tests

      # ---------- 4. Сборка ----------
      - name: Run build.sh
        run: |
          set -o pipefail
          bash ./build.sh 2>&1 | tee /tmp/build_log.txt
        env:
          RUST_BACKTRACE: "1"

      - name: Dump build log (diagnostics)
        if: always()
        run: |
          LOG=/tmp/build_log.txt
          if [ -f "$LOG" ]; then
            SIZE=$(wc -c < "$LOG")
            if ! grep -q "Готово! Образ диска" "$LOG" 2>/dev/null; then
              ERRORS=$(grep -aE "ОШИБКА|error\[E[0-9]+\]|^error:|^warning: unused|E[0-9]+:" "$LOG" | head -25 | tr '\n' '~' | sed 's/~*$//')
              echo "::error::BUILD FAILED::build.sh завершился с ошибкой. Лог: $SIZE байт."
              echo "::error::BUILD ERRORS::$ERRORS"
              echo "## Build log (full)" >> "$GITHUB_STEP_SUMMARY"
              cat "$LOG" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            else
              echo "::warning::BUILD OK::build.sh завершился успешно ($SIZE байт)"
            fi
          else
            echo "::warning::NO LOG::build_log.txt не найден"
          fi

      # ---------- 5. Проверка артефактов ----------
      - name: Verify artifacts
        run: |
          set -e
          echo "== build/ =="
          ls -lh build/
          echo "Diagnostic symbol near reported RIP 0x19edca (addresses vary by build):"
          addr2line -f -C -e build/kernel.elf 0x19edca || true
          nm -n build/kernel.elf | awk '$1 <= "000000000019edca" {line=$0} END {print line}'
          for f in deix_disk.img kernel.bin boot_sector.bin stage2.bin ramboot.bin SHA256SUMS; do
            test -f "build/$f" || { echo "Нет build/$f"; exit 1; }
          done
          ls build/deix-*-x86_64.img >/dev/null || { echo "Нет релизного образа deix-*-x86_64.img"; exit 1; }
          (cd build && sha256sum -c SHA256SUMS)

      # ---------- 6. Smoke-тест: загрузка до маркера ядра ----------
      - name: QEMU boot smoke test
        timeout-minutes: 5
        run: |
          # Ядро не завершает работу само, поэтому QEMU останавливается
          # по timeout; успех определяется маркерами загрузки в serial-логе.
          timeout 120 qemu-system-x86_64 \
            -drive format=raw,file=build/deix_disk.img,if=ide \
            -m 256M \
            -display none \
            -no-reboot \
            -serial stdio \
            -monitor none \
            > qemu_disk.log 2>&1 || [ $? -eq 124 ]
          echo "== QEMU disk log (tail) =="
          tail -n 60 qemu_disk.log
          grep -q '=== DeiX boot: serial debug active ===' qemu_disk.log \
            || { echo "FAIL: нет маркера старта ядра"; exit 1; }
          grep -q 'mini kernel booted successfully!' qemu_disk.log \
            || { echo "FAIL: ядро не дошло до конца инициализации"; exit 1; }
          if grep -q 'KERNEL PANIC' qemu_disk.log; then
            echo "FAIL: паника ядра во время загрузки"; exit 1
          fi

      # ---------- 7. Регрессия: первый и повторные запуски (персистентность) ----------
      - name: QEMU scenario - first boot, account, two reboots
        timeout-minutes: 15
        run: python3 tools/qemu_scenario_reboot.py

      - name: Upload scenario log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-scenario-log
          path: /tmp/qemu_scenario.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 7b. Регрессия: загрузка с USB/Ventoy (без ATA-диска) ----------
      # Проверяет путь, по которому загрузчик (ramboot) заполняет RAM-диск
      # (весь образ в 0x4000000), а ядро читает разделы из памяти — это
      # сценарий загрузки с флешки/Ventoy, где нет аппаратного ATA.
      - name: QEMU scenario - boot from USB (no ATA disk, RAM-disk path)
        timeout-minutes: 15
        run: |
          # Релизная копия создана до QEMU-тестов и не содержит их аккаунтов.
          cp build/deix-*-x86_64.img /tmp/deix-usb-factory.img
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_scenario_usb.py

      - name: Upload USB scenario log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-scenario-usb-log
          path: /tmp/qemu_scenario_usb.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU laptop-like USB boot with AHCI and HDA
        timeout-minutes: 5
        run: |
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_laptop_smoke.py

      - name: Upload laptop-like boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-laptop-smoke-log
          path: /tmp/qemu_laptop_smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU text boot artwork and PS/2 keyboard
        timeout-minutes: 5
        run: DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_keyboard_text_test.py

      - name: Upload text keyboard test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-keyboard-text-log
          path: /tmp/qemu_keyboard_text.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU BIOS VBE non-Bochs graphics
        timeout-minutes: 5
        run: DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_bios_vbe_test.py

      - name: QEMU BIOS VBE HD selection
        timeout-minutes: 5
        run: DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_bios_hd_test.py

      - name: Upload BIOS VBE graphics log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-bios-vbe-log
          path: /tmp/qemu_bios_vbe.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU PS/2 mouse cursor
        timeout-minutes: 5
        run: DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_ps2_mouse_test.py

      - name: Upload PS/2 mouse log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ps2-mouse-log
          path: /tmp/qemu_ps2_mouse.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU EHCI USB keyboard without PS/2
        run: DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_ehci_keyboard_test.py

      - name: QEMU EHCI USB mouse
        timeout-minutes: 5
        run: |
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_ehci_mouse_test.py
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img DEIX_EHCI_USB_BOOT=1 python3 tools/qemu_ehci_mouse_test.py

      - name: Upload EHCI mouse log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ehci-mouse-log
          path: /tmp/qemu_ehci_mouse.log
          if-no-files-found: ignore
          retention-days: 7

      - name: QEMU input with COM1 absent
        timeout-minutes: 5
        run: |
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img python3 tools/qemu_no_uart_input_test.py
          DEIX_USB_IMAGE=/tmp/deix-usb-factory.img DEIX_USB_MOUSE=1 python3 tools/qemu_no_uart_input_test.py

      # ---------- 8. Регрессия: установка на второй диск ----------
      - name: QEMU install test - install to slave disk and boot from it
        timeout-minutes: 15
        run: python3 tools/qemu_install_test.py

      # ---------- 9. Тулчейн MEX ----------
      - name: Subsystems and MEX toolchain test
        run: python3 tools/test_all_subsystems.py

      # ---------- 10. Артефакты ----------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deix-release
          path: |
            build/deix_disk.img
            build/deix-*-x86_64.img
            build/kernel.bin
            build/boot_sector.bin
            build/stage2.bin
            build/ramboot.bin
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Upload ISO (if built)
        if: hashFiles('build/deix.iso') != ''
        uses: actions/upload-artifact@v4
        with:
          name: deix-iso
          path: build/deix.iso
          if-no-files-found: warn
          retention-days: 30

      - name: Upload QEMU logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-logs
          path: qemu_disk.log
          if-no-files-found: ignore
          retention-days: 7
