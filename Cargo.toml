[package]
name = "deix_kernel"
version = "0.3.0"
edition = "2021"

[lib]
name = "deix_kernel"
crate-type = ["staticlib"]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# kernel.bin ограничен геометрией диска (KERNEL_SECTORS=2048 в build.sh и
# boot/*.asm — 1 МиБ). С дефолтным opt-level=3 бинарник перестал влезать,
# поэтому оптимизируем по размеру и включаем LTO. После роста GUI
# (v0.3.0) "s" перестало хватать — используется "z".
opt-level = "z"
lto = true
codegen-units = 1

# Быстрый профиль для отладки: DEIX_PROFILE=fast ./build.sh. Размер ядра
# проверяется теми же лимитами, что и у release.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
